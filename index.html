<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Merry Christmas</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#02030a;}
  #c{display:block;width:100vw;height:100vh;}
  #err{position:fixed;left:8px;top:8px;color:#ff6666;font:12px monospace;z-index:99;white-space:pre-wrap;pointer-events:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<script>
window.onerror = function(msg, url, line, col) {
  var el = document.getElementById('err');
  if (el) el.textContent = '运行错误: ' + msg + ' (行 ' + line + ')';
  return false;
};
(function(){
'use strict';

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
if (!ctx) {
  document.getElementById('err').textContent = '当前环境不支持 Canvas';
  return;
}

var TAU = Math.PI * 2;
var W = 0, H = 0, DPR = 1, bgGrad = null, lastTs = 0;
var starSprite = null, snowSprite = null;
var P = { cx:0, topY:0, baseY:0, treeH:0, maxR:0 };
var treePts = [], spiralLights = [], ornaments = [], snow = [], bgStars = [];
var sparks = [], rockets = [], flashes = [], embers = [];
var fwTimer = 6, emberTimer = 4;
var glowCache = {};

var FW_COLORS = ['#ff2079','#ffd700','#00e5ff','#b000ff','#5dff00','#ff6a00','#ff00d4','#ffffff','#ff3333','#00ff88','#ffaa00','#40a0ff'];
var LEAF_COLORS = ['#0f9d58','#17c96e','#2bf58c','#5dffb0','#0b7a45','#39ff9e','#00ff88'];
var LIGHT_COLORS = ['#ffd700','#ff2079','#00e5ff','#ffffff','#b000ff','#ff8c00','#5dff00','#ff00d4'];

function hexToRgb(hex) {
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
}

function glowSprite(color) {
  var sp = glowCache[color];
  if (sp) return sp;
  var S = 128;
  sp = document.createElement('canvas');
  sp.width = S; sp.height = S;
  var g = sp.getContext('2d');
  var rgb = hexToRgb(color);
  var r = rgb[0], gr = rgb[1], b = rgb[2];
  var rg = g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  rg.addColorStop(0,'rgba('+r+','+gr+','+b+',1)');
  rg.addColorStop(0.10,'rgba('+r+','+gr+','+b+',0.90)');
  rg.addColorStop(0.24,'rgba('+r+','+gr+','+b+',0.46)');
  rg.addColorStop(0.50,'rgba('+r+','+gr+','+b+',0.13)');
  rg.addColorStop(0.76,'rgba('+r+','+gr+','+b+',0.025)');
  rg.addColorStop(1,'rgba('+r+','+gr+','+b+',0)');
  g.fillStyle = rg;
  g.beginPath();
  g.arc(S/2,S/2,S/2,0,TAU);
  g.fill();
  glowCache[color] = sp;
  return sp;
}

function makeSnowSprite() {
  var S = 64;
  var c = document.createElement('canvas');
  c.width = S; c.height = S;
  var g = c.getContext('2d');
  var cx = S/2, cy = S/2;
  var rg = g.createRadialGradient(cx,cy,0,cx,cy,S/2);
  rg.addColorStop(0,'rgba(255,255,255,1)');
  rg.addColorStop(0.22,'rgba(240,248,255,0.62)');
  rg.addColorStop(0.50,'rgba(210,230,255,0.16)');
  rg.addColorStop(1,'rgba(180,210,255,0)');
  g.fillStyle = rg;
  g.beginPath();
  g.arc(cx,cy,S/2,0,TAU);
  g.fill();
  snowSprite = c;
}

function makeStarSprite() {
  var S = 384;
  var c = document.createElement('canvas');
  c.width = S; c.height = S;
  var g = c.getContext('2d');
  var cx = S/2, cy = S/2;
  var rg = g.createRadialGradient(cx,cy,0,cx,cy,S/2);
  rg.addColorStop(0,'rgba(255,255,245,1)');
  rg.addColorStop(0.06,'rgba(255,246,190,0.92)');
  rg.addColorStop(0.18,'rgba(255,215,110,0.36)');
  rg.addColorStop(0.45,'rgba(255,175,55,0.07)');
  rg.addColorStop(1,'rgba(255,150,0,0)');
  g.fillStyle = rg;
  g.beginPath();
  g.arc(cx,cy,S/2,0,TAU);
  g.fill();
  g.translate(cx,cy);
  g.globalCompositeOperation = 'lighter';
  for (var i = 0; i < 16; i++) {
    var long = (i % 2 === 0);
    var len = S * (long ? 0.47 : 0.21);
    var w = S * (long ? 0.030 : 0.017);
    var lg = g.createLinearGradient(0,0,0,-len);
    lg.addColorStop(0,'rgba(255,253,235,1)');
    lg.addColorStop(0.30,'rgba(255,232,140,0.55)');
    lg.addColorStop(0.70,'rgba(255,205,70,0.10)');
    lg.addColorStop(1,'rgba(255,190,40,0)');
    g.fillStyle = lg;
    g.beginPath();
    g.moveTo(-w,0);
    g.lineTo(0,-len);
    g.lineTo(w,0);
    g.closePath();
    g.fill();
    g.rotate(TAU/16);
  }
  starSprite = c;
}

function buildScene() {
  var cx    = W * 0.5;
  var baseY = H * 0.81;
  var topY  = H * 0.13;
  var treeH = baseY - topY;
  var maxR  = Math.min(W * 0.29, treeH * 0.30);

  P.cx = cx; P.topY = topY; P.baseY = baseY; P.treeH = treeH; P.maxR = maxR;

  treePts = []; spiralLights = []; ornaments = []; snow = []; bgStars = [];
  sparks = []; rockets = []; flashes = []; embers = [];
  fwTimer = 4; emberTimer = 2;

  var n = Math.round(Math.max(1000, Math.min(2200, W * H / 550)));
  for (var i = 0; i < n; i++) {
    var h  = Math.random();
    var R  = maxR * Math.pow(1 - h, 1.06);
    var rr = R * (0.10 + 0.90 * Math.pow(Math.random(), 0.55));
    var ang = Math.random() * TAU;
    var col = LEAF_COLORS[(Math.random() * LEAF_COLORS.length) | 0];
    treePts.push({
      r: rr, ang: ang,
      y: baseY - h * treeH,
      size: 1.2 + Math.random() * 1.6,
      alpha: 0.12 + Math.random() * 0.22,
      sprite: glowSprite(col),
      phase: Math.random() * TAU,
      tw: 0.0012 + Math.random() * 0.0024
    });
  }

  var steps = Math.round(Math.max(160, Math.min(300, W * 0.20)));
  var turns = 5.4;
  for (var j = 0; j < steps; j++) {
    var t   = j / steps;
    var R2  = maxR * Math.pow(1 - t, 1.02) * 0.96;
    var ang2 = t * turns * TAU;
    var col2 = LIGHT_COLORS[j % LIGHT_COLORS.length];
    spiralLights.push({
      t: t, r: R2, ang: ang2,
      y: baseY - t * treeH,
      size: 2.3 + Math.random() * 1.4,
      sprite: glowSprite(col2)
    });
  }

  var m = Math.round(Math.max(30, Math.min(56, W * 0.042)));
  for (var k = 0; k < m; k++) {
    var h3 = Math.pow(Math.random(), 0.72);
    var R3 = maxR * Math.pow(1 - h3, 1.02) * (0.55 + 0.45 * Math.random());
    var col3 = LIGHT_COLORS[(Math.random() * LIGHT_COLORS.length) | 0];
    ornaments.push({
      r: R3, ang: Math.random() * TAU,
      y: baseY - h3 * treeH,
      size: 3.4 + Math.random() * 3.0,
      sprite: glowSprite(col3),
      phase: Math.random() * TAU
    });
  }

  var sn = Math.round(Math.max(280, Math.min(480, W * H / 3600)));
  for (var p = 0; p < sn; p++) {
    snow.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 0.8 + Math.random() * 2.6,
      vy: 0.30 + Math.random() * 1.35,
      drift: 0.35 + Math.random() * 1.1,
      driftSpeed: 0.6 + Math.random() * 0.8,
      phase: Math.random() * TAU,
      alpha: 0.30 + Math.random() * 0.55,
      tw: 0.0015 + Math.random() * 0.003
    });
  }

  var st = Math.round(Math.max(90, Math.min(220, W * H / 8000)));
  for (var q = 0; q < st; q++) {
    bgStars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.85,
      r: 0.3 + Math.random() * 1.2,
      phase: Math.random() * TAU,
      speed: 0.5 + Math.random() * 2.0
    });
  }
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || document.documentElement.clientWidth || 800;
  H = window.innerHeight || document.documentElement.clientHeight || 600;
  if (W < 10) W = 800;
  if (H < 10) H = 600;

  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0,    '#02030a');
  bgGrad.addColorStop(0.38, '#050818');
  bgGrad.addColorStop(0.72, '#0a0a1f');
  bgGrad.addColorStop(1,    '#150a1e');

  buildScene();
}

function drawBgStars(time) {
  ctx.globalCompositeOperation = 'lighter';
  var sp = glowSprite('#cfe4ff');
  for (var i = 0; i < bgStars.length; i++) {
    var s = bgStars[i];
    var tw = 0.30 + 0.70 * (0.5 + 0.5 * Math.sin(time * 0.001 * s.speed + s.phase));
    ctx.globalAlpha = tw * 0.75;
    var r = s.r * 3.2;
    ctx.drawImage(sp, s.x - r, s.y - r, r * 2, r * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawGround() {
  var cx = P.cx, baseY = P.baseY, maxR = P.maxR;
  ctx.globalCompositeOperation = 'lighter';
  ctx.save();
  ctx.translate(cx, baseY);
  ctx.scale(1, 0.28);
  var R = maxR * 2.6;
  var g = ctx.createRadialGradient(0,0,0, 0,0,R);
  g.addColorStop(0,   'rgba(60,255,170,0.22)');
  g.addColorStop(0.4, 'rgba(30,180,110,0.075)');
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0,0,R,0,TAU);
  ctx.fill();
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
}

function spawnRocket() {
  var x = W * (0.08 + Math.random() * 0.84);
  var startY = H * 1.03;
  var targetY = H * (0.06 + Math.random() * 0.38);
  var dur = 40 + Math.random() * 22;
  var vy = (targetY - startY) / dur;
  var color = FW_COLORS[(Math.random() * FW_COLORS.length) | 0];
  rockets.push({
    x: x, y: startY, px: x, py: startY,
    vx: (Math.random() - 0.5) * 0.6,
    vy: vy,
    targetY: targetY,
    color: color
  });
}

function explode(x, y, color) {
  var style = Math.random();
  var n, speed, gravity, drag, lifeDecay;

  if (style < 0.28) {
    n = 110; speed = 4.2; gravity = 0.030; drag = 0.986; lifeDecay = 0.008;
  } else if (style < 0.52) {
    n = 155; speed = 3.6; gravity = 0.040; drag = 0.983; lifeDecay = 0.010;
  } else if (style < 0.72) {
    n = 105; speed = 2.6; gravity = 0.052; drag = 0.991; lifeDecay = 0.007;
  } else if (style < 0.90) {
    n = 190; speed = 4.6; gravity = 0.035; drag = 0.981; lifeDecay = 0.011;
  } else {
    n = 140; speed = 3.9; gravity = 0.038; drag = 0.985; lifeDecay = 0.009;
  }

  var c2 = Math.random() < 0.5 ? FW_COLORS[(Math.random() * FW_COLORS.length) | 0] : null;
  var isRing = style < 0.28 || style >= 0.90;
  var isWillow = style >= 0.52 && style < 0.72;

  for (var i = 0; i < n; i++) {
    var ang, sp;
    if (isRing) {
      ang = (i / n) * TAU + (Math.random() - 0.5) * 0.05;
      sp  = speed * (0.93 + Math.random() * 0.14);
    } else {
      ang = Math.random() * TAU;
      sp  = speed * Math.pow(Math.random(), isWillow ? 0.75 : 0.55);
    }
    var col = (c2 && Math.random() < 0.40) ? c2 : color;
    sparks.push({
      x: x, y: y, px: x, py: y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      life: 1,
      decay: lifeDecay * (0.70 + Math.random() * 0.60),
      gravity: gravity, drag: drag,
      color: col,
      sprite: glowSprite(col),
      size: 1.1 + Math.random() * 1.6,
      willow: isWillow
    });
  }

  var flick = 14 + Math.floor(Math.random() * 22);
  for (var f = 0; f < flick; f++) {
    var fa = Math.random() * TAU;
    var fs = 0.5 + Math.random() * 1.8;
    sparks.push({
      x: x, y: y, px: x, py: y,
      vx: Math.cos(fa) * fs,
      vy: Math.sin(fa) * fs,
      life: 1, decay: 0.020 + Math.random() * 0.020,
      gravity: 0.020, drag: 0.980,
      color: '#ffffff',
      sprite: glowSprite('#ffffff'),
      size: 0.7 + Math.random() * 1.2,
      willow: false
    });
  }

  flashes.push({ x: x, y: y, maxR: 75 + Math.random() * 100, life: 1, color: color });

  if (sparks.length > 3600) sparks.splice(0, sparks.length - 3600);
}

function updateFireworks(dt, time) {
  fwTimer -= dt;
  if (fwTimer <= 0 && rockets.length < 4) {
    fwTimer = 12 + Math.random() * 30;
    spawnRocket();
    if (Math.random() < 0.20) spawnRocket();
  }

  for (var i = rockets.length - 1; i >= 0; i--) {
    var r = rockets[i];
    r.px = r.x; r.py = r.y;
    r.x += r.vx * dt;
    r.y += r.vy * dt;

    if (sparks.length < 3400 && Math.random() < 0.85) {
      sparks.push({
        x: r.x + (Math.random() - 0.5) * 2,
        y: r.y + Math.random() * 5,
        px: r.x, py: r.y,
        vx: (Math.random() - 0.5) * 0.35,
        vy: 0.25 + Math.random() * 0.55,
        life: 1, decay: 0.045 + Math.random() * 0.030,
        gravity: 0.01, drag: 0.985,
        color: r.color,
        sprite: glowSprite(r.color),
        size: 0.7 + Math.random() * 0.9,
        willow: false
      });
    }

    if (r.y <= r.targetY || r.y < -60) {
      explode(r.x, r.y, r.color);
      rockets.splice(i, 1);
    }
  }

  for (var s = sparks.length - 1; s >= 0; s--) {
    var sp = sparks[s];
    sp.px = sp.x; sp.py = sp.y;
    sp.vx *= sp.drag;
    sp.vy *= sp.drag;
    sp.vy += sp.gravity * dt;
    sp.x += sp.vx * dt;
    sp.y += sp.vy * dt;
    sp.life -= sp.decay * dt;
    if (sp.life <= 0 || sp.y > H + 100) sparks.splice(s, 1);
  }

  for (var fl = flashes.length - 1; fl >= 0; fl--) {
    flashes[fl].life -= 0.052 * dt;
    if (flashes[fl].life <= 0) flashes.splice(fl, 1);
  }
}

function drawFireworks() {
  ctx.globalCompositeOperation = 'lighter';

  for (var i = 0; i < flashes.length; i++) {
    var f = flashes[i];
    var rr = f.maxR * (1 - f.life * 0.88);
    var a = f.life * f.life * 0.85;
    if (a <= 0.01) continue;
    ctx.globalAlpha = a;
    ctx.drawImage(glowSprite(f.color), f.x - rr, f.y - rr, rr * 2, rr * 2);
  }

  for (var r = 0; r < rockets.length; r++) {
    var rk = rockets[r];
    ctx.globalAlpha = 1;
    ctx.strokeStyle = rk.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(rk.px, rk.py);
    ctx.lineTo(rk.x, rk.y);
    ctx.stroke();
    var s = 10;
    ctx.globalAlpha = 0.95;
    ctx.drawImage(glowSprite(rk.color), rk.x - s, rk.y - s, s * 2, s * 2);
  }

  for (var k = 0; k < sparks.length; k++) {
    var sp = sparks[k];
    var al = sp.life * sp.life;
    if (al < 0.02) continue;

    ctx.globalAlpha = al;
    ctx.strokeStyle = sp.color;
    ctx.lineWidth = sp.size * (sp.willow ? 0.85 : 0.70);
    ctx.beginPath();
    ctx.moveTo(sp.px, sp.py);
    ctx.lineTo(sp.x, sp.y);
    ctx.stroke();

    ctx.globalAlpha = al * 0.55;
    var rr2 = sp.size * (sp.willow ? 3.2 : 2.6);
    ctx.drawImage(sp.sprite, sp.x - rr2, sp.y - rr2, rr2 * 2, rr2 * 2);
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawTree(time) {
  var cx = P.cx;
  var rot = time * 0.00023;
  ctx.globalCompositeOperation = 'lighter';

  var midY = P.topY + P.treeH * 0.5;
  var R0 = P.treeH * 0.85;
  var g = ctx.createRadialGradient(cx, midY, 0, cx, midY, R0);
  g.addColorStop(0,   'rgba(30,230,140,0.10)');
  g.addColorStop(0.5, 'rgba(20,170,100,0.045)');
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.globalAlpha = 1;
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, midY, R0, 0, TAU);
  ctx.fill();

  for (var i = 0; i < treePts.length; i++) {
    var p = treePts[i];
    var a = p.ang + rot;
    var z = (Math.sin(a) + 1) * 0.5;
    var depth = 0.32 + 0.68 * z;
    var x = cx + p.r * Math.cos(a);
    var tw = 0.84 + 0.16 * Math.sin(time * p.tw + p.phase);
    var al = p.alpha * depth * tw;
    if (al < 0.012) continue;
    var sz = p.size * depth * 3.6;
    ctx.globalAlpha = al;
    ctx.drawImage(p.sprite, x - sz, p.y - sz, sz * 2, sz * 2);
  }

  for (var j = 0; j < spiralLights.length; j++) {
    var sp = spiralLights[j];
    var a2 = sp.ang + rot;
    var z2 = (Math.sin(a2) + 1) * 0.5;
    var d2 = 0.45 + 0.55 * z2;
    var x2 = cx + sp.r * Math.cos(a2);
    var flow = 0.5 + 0.5 * Math.sin(time * 0.0035 - sp.t * 9.0);
    ctx.globalAlpha = (0.20 + 0.80 * flow) * d2;
    var sz2 = sp.size * d2 * 3.8;
    ctx.drawImage(sp.sprite, x2 - sz2, sp.y - sz2, sz2 * 2, sz2 * 2);
  }

  for (var k = 0; k < ornaments.length; k++) {
    var o = ornaments[k];
    var a3 = o.ang + rot;
    var z3 = (Math.sin(a3) + 1) * 0.5;
    var d3 = 0.5 + 0.5 * z3;
    var x3 = cx + o.r * Math.cos(a3);
    var tw3 = 0.6 + 0.4 * Math.sin(time * 0.004 + o.phase);
    ctx.globalAlpha = (0.42 + 0.58 * tw3) * d3;
    var sz3 = o.size * d3 * 3.4;
    ctx.drawImage(o.sprite, x3 - sz3, o.y - sz3, sz3 * 2, sz3 * 2);
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawStar(time) {
  if (!starSprite) return;
  var cx = P.cx, topY = P.topY;
  var pulse = 0.90 + 0.10 * Math.sin(time * 0.0028);
  var size = Math.max(100, P.treeH * 0.42) * pulse;

  ctx.globalCompositeOperation = 'lighter';

  var R = size * 0.5;
  var g = ctx.createRadialGradient(cx, topY, 0, cx, topY, R);
  g.addColorStop(0,    'rgba(255,250,220,0.55)');
  g.addColorStop(0.35, 'rgba(255,215,110,0.16)');
  g.addColorStop(1,    'rgba(255,180,40,0)');
  ctx.globalAlpha = 1;
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, topY, R, 0, TAU);
  ctx.fill();

  ctx.save();
  ctx.translate(cx, topY);
  ctx.rotate(time * 0.00035);
  ctx.drawImage(starSprite, -size * 0.5, -size * 0.5, size, size);
  ctx.restore();

  ctx.globalCompositeOperation = 'source-over';
}

function updateEmbers(dt, time) {
  emberTimer -= dt;
  if (emberTimer <= 0) {
    emberTimer = 3 + Math.random() * 9;
    if (embers.length < 130) {
      var col = Math.random() < 0.6 ? '#ffd700' : '#ff9a3c';
      embers.push({
        x: P.cx + (Math.random() - 0.5) * P.maxR * 2.8,
        y: P.baseY - Math.random() * P.treeH * 0.3,
        vx: (Math.random() - 0.5) * 0.20,
        vy: -0.20 - Math.random() * 0.65,
        life: 1,
        decay: 0.003 + Math.random() * 0.005,
        size: 0.7 + Math.random() * 1.5,
        phase: Math.random() * TAU,
        sprite: glowSprite(col)
      });
    }
  }
  for (var i = embers.length - 1; i >= 0; i--) {
    var e = embers[i];
    e.x += (e.vx + Math.sin(time * 0.0016 + e.phase) * 0.25) * dt;
    e.y += e.vy * dt;
    e.life -= e.decay * dt;
    if (e.life <= 0 || e.y < P.topY - 40) embers.splice(i, 1);
  }
}

function drawEmbers(time) {
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < embers.length; i++) {
    var e = embers[i];
    var a = e.life * (0.5 + 0.5 * Math.sin(time * 0.004 + e.phase * 2));
    if (a < 0.03) continue;
    ctx.globalAlpha = a;
    var r = e.size * 3.6;
    ctx.drawImage(e.sprite, e.x - r, e.y - r, r * 2, r * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function updateSnow(dt, time) {
  for (var i = 0; i < snow.length; i++) {
    var s = snow[i];
    s.y += s.vy * dt;
    s.x += Math.sin(time * 0.001 * s.driftSpeed + s.phase) * s.drift * dt;
    if (s.y > H + 10) { s.y = -10; s.x = Math.random() * W; }
    if (s.x < -15) s.x = W + 15;
    else if (s.x > W + 15) s.x = -15;
  }
}

function drawSnow(time) {
  if (!snowSprite) return;
  ctx.globalCompositeOperation = 'lighter';
  for (var i = 0; i < snow.length; i++) {
    var s = snow[i];
    var tw = 0.62 + 0.38 * Math.sin(time * s.tw + s.phase);
    ctx.globalAlpha = s.alpha * tw;
    var r = s.r * 2.2;
    ctx.drawImage(snowSprite, s.x - r, s.y - r, r * 2, r * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawText() {
  var cx = P.cx;
  var fs1 = Math.min(W * 0.038, 26);
  var fs2 = Math.min(W * 0.022, 13);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.save();
  ctx.shadowColor = 'rgba(255,205,95,0.9)';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#ffeab8';
  ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", "Songti SC", serif';
  ctx.fillText('Merry Christmas', cx, H * 0.905);
  ctx.restore();

  ctx.save();
  ctx.shadowColor = 'rgba(255,110,160,0.85)';
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#ffd6e6';
  ctx.font = '400 ' + fs2 + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('给最可爱的你 ❤', cx, H * 0.905 + fs1 * 1.0);
  ctx.restore();
}

function loop(ts) {
  if (!lastTs) lastTs = ts;
  var dt = (ts - lastTs) / 16.667;
  lastTs = ts;
  if (dt > 3) dt = 3;
  if (dt <= 0) dt = 1;

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  if (bgGrad) {
    ctx.fillStyle = bgGrad;
  } else {
    ctx.fillStyle = '#02030a';
  }
  ctx.fillRect(0, 0, W, H);

  drawBgStars(ts);
  drawGround();

  updateFireworks(dt, ts);
  drawFireworks();

  drawTree(ts);
  drawStar(ts);

  updateEmbers(dt, ts);
  drawEmbers(ts);

  updateSnow(dt, ts);
  drawSnow(ts);

  drawText();

  requestAnimationFrame(loop);
}

function onTap(e) {
  var x, y;
  if (e.touches && e.touches.length) {
    x = e.touches[0].clientX;
    y = e.touches[0].clientY;
  } else {
    x = e.clientX;
    y = e.clientY;
  }
  explode(x, y, FW_COLORS[(Math.random() * FW_COLORS.length) | 0]);
}

function init() {
  makeSnowSprite();
  makeStarSprite();
  resize();
  requestAnimationFrame(loop);

  canvas.addEventListener('pointerdown', onTap);

  for (var i = 0; i < 3; i++) {
    (function(idx){
      setTimeout(function () {
        explode(W * (0.2 + Math.random() * 0.6), H * (0.15 + Math.random() * 0.35),
                FW_COLORS[(Math.random() * FW_COLORS.length) | 0]);
      }, 300 + idx * 500);
    })(i);
  }
}

var rzTimer;
window.addEventListener('resize', function () {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(resize, 150);
});

if (document.readyState === 'complete' || document.readyState === 'interactive') {
  setTimeout(init, 0);
} else {
  window.addEventListener('DOMContentLoaded', init);
}

})();
</script>
